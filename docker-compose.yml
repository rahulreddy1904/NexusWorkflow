version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexus_dev_password_2026
      POSTGRES_DB: nexus_workflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:nexus_dev_password_2026@postgres:5432/nexus_workflow
      DATABASE_SSL: "false"
      JWT_SECRET: nexus_docker_jwt_secret_key_32_characters_minimum
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3.8-flash
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      - postgres

volumes:
  pgdata:
